<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titre template</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #a8ddcd, #a8ddcd);
        color: #9f0064;
      }
      .card {
        background: rgba(255, 255, 255, 0.36);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 40px 32px;
        width: min(400px, 90vw);
        text-align: center;
        backdrop-filter: blur(8px);
      }
      h1 { font-size: 1.4rem; margin-bottom: 8px; }
      p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 28px; }
      .inputs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      input {
        width: clamp(38px, calc((100% - 8px * 7) / 8), 56px);
        height: 64px;
        font-size: 1.8rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: rgba(248, 252, 250, 1);
        color: #9f0064;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus { border-color: #a8ddcd; }
      .msg { min-height: 22px; font-size: 0.85rem; margin-bottom: 8px; }
      .msg.error { color: #f87171; }
      button {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        background: #9f0064;
        color: #f8fcfa;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: #df0448; }
      .hint { margin-top: 16px; font-size: 0.75rem; color: #64748b; }
      header.brand {
        position: absolute; top: 20px; left: 20px;
        display: flex; align-items: center; gap: 10px;
        font-weight: 600; font-size: 0.9rem; opacity: 0.85;
      }
      header.brand svg { width: 36px; height: 36px; }
      footer.copyright {
        position: absolute; bottom: 14px; left: 0; width: 100%;
        text-align: center; font-size: 0.75rem; opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="9" fill="#9f0064"></rect>
        <text x="20" y="26" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="Inter, system-ui, sans-serif">EPFL</text>
      </svg>
      <span>Antibio Quest</span>
    </header>

    <main class="card">
      <h1>TITRE</h1> <!-- template -->

      <p class="sub">Entrez le code à ... chiffres pour continuer</p> <!-- template -->
      
      <div class="inputs" id="inputs"></div>
      <div class="msg" id="msg"></div>
      <button id="btn">Valider</button>
      <p class="hint">Code par défaut : 12345657 (modifiable dans le script)</p>
    </main>
    <footer class="copyright">© 2026 EPFL - Service de Promotion des Sciences</footer>

    <script>
      var CODE = "1234567"; // ← code de 2 à 8 chiffres : la longueur décide du nombre de cases
      var PAGE_SUIVANTE = "template_page_valide.html"; // ← nom du fichier de la 2e page
      
      // Génération dynamique des cases selon la longueur du code
      var inputs = [];
      var conteneur = document.getElementById("inputs");
      for (var i = 0; i < CODE.length; i++) {
        var input = document.createElement("input");
        input.type = "text";
        input.setAttribute("inputmode", "numeric");
        input.setAttribute("maxlength", "1");
        input.autocomplete = "off";
        conteneur.appendChild(input);
        inputs.push(input);
      }
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");

      // Focus automatique et navigation entre les 4 cases
      inputs.forEach(function (input, i) {
        input.addEventListener("input", function () {
          input.value = input.value.replace(/\D/g, "").slice(0, 1);
          if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
          if (inputs.every(function (x) { return x.value; })) valider();
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
        });
        input.addEventListener("paste", function (e) {
          e.preventDefault();
          var data = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
          data.slice(0, CODE.length).split("").forEach(function (d, j) {
            if (inputs[j]) inputs[j].value = d;
          });
          inputs[Math.min(data.length, CODE.length - 1)].focus();
          if (data.slice(0, CODE.length).length === CODE.length) valider();
        });
      });

      function valider() {
        var saisie = inputs.map(function (x) { return x.value; }).join("");
        if (saisie === CODE) {
          // Marque la session comme autorisée pour la page 2
          try { sessionStorage.setItem("accesOK", "1"); } catch (e) {}
          window.location.href = PAGE_SUIVANTE;
        } else {
          msg.textContent = "Code incorrect. Réessayez.";
          msg.className = "msg error";
          inputs.forEach(function (x) { x.value = ""; });
          inputs[0].focus();
        }
      }

      btn.addEventListener("click", valider);
      inputs[0].focus();
    </script>
  </body>
</html>
